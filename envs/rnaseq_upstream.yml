# Environment: bioinfo (user-created on Bridges-2)
# To recreate: conda env create -f envs/bioinfo.lock.yml
# Used for: Stages 2-7 (FastQC, fastp, STAR, featureCounts, samtools, rseqc)
# sra-tools excluded due to segfault issues on Bridges-2, using wget/ENA instead


name: bioinfo
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - fastqc
  - multiqc
  - fastp
  - star=2.7.10b
  - subread
  - samtools
  - rseqc
